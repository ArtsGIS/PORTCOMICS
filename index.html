<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrousel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      background: #0f0f0f;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    #container {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
    }

    #carousel {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      opacity: 1;
      transition: opacity 0.45s ease;
    }

    #carousel.fade-out {
      opacity: 0;
    }

    /* Flèches de navigation */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      border: 2px solid rgba(255, 255, 255, 0.7);
      color: white;
      font-size: 26px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: all 0.25s ease;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.95);
      color: #111;
      border-color: white;
      transform: translateY(-50%) scale(1.08);
    }

    #prev { left: 18px; }
    #next { right: 18px; }

    /* Indicateurs (points) */
    #dots {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 20;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .dot.active {
      background: white;
      transform: scale(1.25);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
    }

    /* Compteur */
    #counter {
      position: absolute;
      top: 18px;
      right: 20px;
      background: rgba(0, 0, 0, 0.55);
      color: white;
      font-size: 14px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 20;
    }
  </style>
</head>
<body>

  <div id="container">
    <img id="carousel" src="https://artsgis.maps.arcgis.com/sharing/rest/content/items/db937b4788c64139be20030b4c4f6e5c/data" alt="Image du carrousel">

    <button class="nav-btn" id="prev" onclick="changeSlide(-1)">‹</button>
    <button class="nav-btn" id="next" onclick="changeSlide(1)">›</button>

    <div id="dots"></div>
    <div id="counter"></div>
  </div>

  <script>
    const images = [
      "https://artsgis.maps.arcgis.com/sharing/rest/content/items/db937b4788c64139be20030b4c4f6e5c/data",
      "https://artsgis.maps.arcgis.com/sharing/rest/content/items/8030d760d50d45038970df08479f4543/data",
      "https://artsgis.maps.arcgis.com/sharing/rest/content/items/4d83832b0ba14b54be93ad22d4e1841c/data"
    ];

    let current = 0;
    const img = document.getElementById('carousel');
    const dotsContainer = document.getElementById('dots');
    const counter = document.getElementById('counter');

    // Création des points
    images.forEach((_, index) => {
      const dot = document.createElement('div');
      dot.classList.add('dot');
      if (index === 0) dot.classList.add('active');
      dot.addEventListener('click', () => goToSlide(index));
      dotsContainer.appendChild(dot);
    });

    function updateUI() {
      // Mise à jour des points
      document.querySelectorAll('.dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === current);
      });

      // Mise à jour du compteur
      counter.textContent = `${current + 1} / ${images.length}`;
    }

    function changeSlide(direction) {
      img.classList.add('fade-out');

      setTimeout(() => {
        current = (current + direction + images.length) % images.length;
        img.src = images[current];
        img.classList.remove('fade-out');
        updateUI();
      }, 220);
    }

    function goToSlide(index) {
      if (index === current) return;
      img.classList.add('fade-out');

      setTimeout(() => {
        current = index;
        img.src = images[current];
        img.classList.remove('fade-out');
        updateUI();
      }, 220);
    }

    // Navigation clavier
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') changeSlide(-1);
      if (e.key === 'ArrowRight') changeSlide(1);
    });

    // Initialisation
    updateUI();
  </script>
</body>
</html>
