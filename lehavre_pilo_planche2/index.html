<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrousel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      background: #0f0f0f;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    #container {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #0f0f0f;
    }

    /* Zone de l'image */
    #image-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    #carousel {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    #carousel.fade-out {
      opacity: 0;
    }

    /* Flèches de navigation */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      border: 2px solid rgba(255, 255, 255, 0.7);
      color: white;
      font-size: 26px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: all 0.25s ease;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.95);
      color: #111;
      border-color: white;
      transform: translateY(-50%) scale(1.08);
    }

    #prev { left: 18px; }
    #next { right: 18px; }

    /* Zone légende + points */
    #bottom-bar {
      background: rgba(0, 0, 0, 0.75);
      padding: 14px 20px 16px;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    #caption {
      color: white;
      font-size: 15px;
      line-height: 1.4;
      margin-bottom: 12px;
      min-height: 20px;
    }

    #dots {
      display: flex;
      justify-content: center;
      gap: 9px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      border: 1.5px solid rgba(255, 255, 255, 0.5);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .dot.active {
      background: white;
      transform: scale(1.25);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
    }

    /* Compteur */
    #counter {
      position: absolute;
      top: 16px;
      right: 18px;
      background: rgba(0, 0, 0, 0.55);
      color: white;
      font-size: 13px;
      font-weight: 500;
      padding: 5px 11px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 20;
    }
  </style>
</head>
<body>

  <div id="container">
    <div id="image-wrapper">
      <img id="carousel" src="" alt="Image du carrousel">
      <button class="nav-btn" id="prev" onclick="changeSlide(-1)">‹</button>
      <button class="nav-btn" id="next" onclick="changeSlide(1)">›</button>
      <div id="counter"></div>
    </div>

    <div id="bottom-bar">
      <div id="caption"></div>
      <div id="dots"></div>
    </div>
  </div>

  <script>
    // ========== MODIFIE ICI TES IMAGES + LÉGENDES ==========
    const slides = [
      {
        image: "https://artsgis.maps.arcgis.com/sharing/rest/content/items/40826fe0e2114b138da6ce67f413434b/data",
        caption: "Légende de la première image"
      },
      {
        image: "https://artsgis.maps.arcgis.com/sharing/rest/content/items/6f52c4f7c95143c8a98ac1052479342d/data",
        caption: "Légende de la deuxième image"
      },
      {
        image: "https://artsgis.maps.arcgis.com/sharing/rest/content/items/160cb966a5474d21ae65c702213c2dbd/data",
        caption: "Légende de la troisième image"
      },
      {
        image: "https://artsgis.maps.arcgis.com/sharing/rest/content/items/70545c6de9f84cd6acf1e94788c190d9/data",
        caption: "Légende de la quatrième image"
      },
      {
        image: "https://artsgis.maps.arcgis.com/sharing/rest/content/items/a87d61c5613443949a5b5f06425d9c65/data",
        caption: "Légende de la cinquième image"
      }
    ];
    // =======================================================

    let current = 0;
    const img = document.getElementById('carousel');
    const caption = document.getElementById('caption');
    const dotsContainer = document.getElementById('dots');
    const counter = document.getElementById('counter');

    // Création des points
    slides.forEach((_, index) => {
      const dot = document.createElement('div');
      dot.classList.add('dot');
      if (index === 0) dot.classList.add('active');
      dot.addEventListener('click', () => goToSlide(index));
      dotsContainer.appendChild(dot);
    });

    function updateUI() {
      img.src = slides[current].image;
      caption.textContent = slides[current].caption;

      document.querySelectorAll('.dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === current);
      });

      counter.textContent = `${current + 1} / ${slides.length}`;
    }

    function changeSlide(direction) {
      img.classList.add('fade-out');

      setTimeout(() => {
        current = (current + direction + slides.length) % slides.length;
        updateUI();
        img.classList.remove('fade-out');
      }, 200);
    }

    function goToSlide(index) {
      if (index === current) return;
      img.classList.add('fade-out');

      setTimeout(() => {
        current = index;
        updateUI();
        img.classList.remove('fade-out');
      }, 200);
    }

    // Navigation clavier
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') changeSlide(-1);
      if (e.key === 'ArrowRight') changeSlide(1);
    });

    // Initialisation
    updateUI();
  </script>
</body>
</html>
