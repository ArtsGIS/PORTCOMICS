<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Carrousel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      background: #0f0f0f;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    #container {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      height: var(--app-h, 100dvh);
      display: flex;
      flex-direction: column;
      background: #0f0f0f;
    }

    #image-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }

    #carousel {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    #carousel.fade-out {
      opacity: 0;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      border: 2px solid rgba(255, 255, 255, 0.7);
      color: white;
      font-size: 26px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: all 0.25s ease;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.95);
      color: #111;
      border-color: white;
      transform: translateY(-50%) scale(1.08);
    }

    #prev { left: 18px; }
    #next { right: 18px; }

    #bottom-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 15;
      background: linear-gradient(to top, rgba(0,0,0,.92) 0%, rgba(0,0,0,.78) 55%, rgba(0,0,0,0) 100%);
      padding: 28px 16px calc(12px + env(safe-area-inset-bottom, 0px));
      text-align: center;
    }

    #caption {
      color: white;
      font-size: clamp(16px, 2.2vw + 0.7vh, 22px);
      line-height: 1.35;
      margin: 0 auto 10px;
      font-weight: 500;
      text-shadow: 0 1px 2px rgba(0,0,0,.8);
      max-width: 62ch;
    }

    #dots {
      display: flex;
      justify-content: center;
      gap: 9px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      border: 1.5px solid rgba(255, 255, 255, 0.5);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .dot.active {
      background: white;
      transform: scale(1.25);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
    }

    #counter {
      position: absolute;
      top: 16px;
      right: 18px;
      background: rgba(0, 0, 0, 0.55);
      color: white;
      font-size: 13px;
      font-weight: 500;
      padding: 5px 11px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 20;
    }

    @media (max-width: 720px), (max-height: 640px) {
      .nav-btn {
        width: 40px;
        height: 40px;
        font-size: 22px;
      }
      #prev { left: 8px; }
      #next { right: 8px; }
      #caption { font-size: clamp(15px, 3.6vw, 19px); }
      #bottom-bar {
        padding: 22px 12px calc(10px + env(safe-area-inset-bottom, 0px));
      }
      #counter {
        top: 8px;
        right: 8px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="image-wrapper">
      <img id="carousel" src="" alt="Image du carrousel">
      <button class="nav-btn" id="prev" onclick="changeSlide(-1)">‹</button>
      <button class="nav-btn" id="next" onclick="changeSlide(1)">›</button>
      <div id="counter"></div>
    </div>

    <div id="bottom-bar">
      <div id="caption"></div>
      <div id="dots"></div>
    </div>
  </div>

  <script>
    const slides = [
      {
        image: "https://artsgis.maps.arcgis.com/sharing/rest/content/items/daa322c1306b411dad09fac396f64924/data",
        caption: "Il ne parle pas à Julien. Il parle te parle. Quelqu’un doit regarder dehors, pas le dashboard.e"
      },
      {
        image: "https://artsgis.maps.arcgis.com/sharing/rest/content/items/39da55dc39204747a56db4c4ada65e38/data",
        caption: "Le badge vaut plus que le slot. High-value : voir *qui* passe, pas seulement *ce* qui passe."
      },
      {
        image: "https://artsgis.maps.arcgis.com/sharing/rest/content/items/0d6c6f4187de4d80ae83d5413aefff2d/data",
        caption: "Temps, proximité, souplesse, désenclavement. Il a raison sur la carte. Julien a raison sur le patch."
      },
      {
        image: "https://artsgis.maps.arcgis.com/sharing/rest/content/items/ed41f64d58a14f05a983f70d1d7622e9/data",
        caption: "Julien a mis son corps devant le DAF. Garder la main, et la voir se fermer par un autre humain."
      },
      {
        image: "https://artsgis.maps.arcgis.com/sharing/rest/content/items/1d096339fef542edaeceea259931c3f7/data",
        caption: "On le retrouvera le long du fer, pas le long de sa route. Le cadrage dit « assassiné ? ». Le corridor n’a pas de PV."
      }
    ];

    let current = 0;
    const img = document.getElementById('carousel');
    const caption = document.getElementById('caption');
    const dotsContainer = document.getElementById('dots');
    const counter = document.getElementById('counter');

    function fitViewport() {
      const h = (window.visualViewport && window.visualViewport.height)
        ? window.visualViewport.height
        : window.innerHeight;
      document.documentElement.style.setProperty('--app-h', h + 'px');
    }
    fitViewport();
    window.addEventListener('resize', fitViewport);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', fitViewport);
    }

    slides.forEach((_, index) => {
      const dot = document.createElement('div');
      dot.classList.add('dot');
      if (index === 0) dot.classList.add('active');
      dot.addEventListener('click', () => goToSlide(index));
      dotsContainer.appendChild(dot);
    });

    function updateUI() {
      img.src = slides[current].image;
      caption.textContent = slides[current].caption;
      document.querySelectorAll('.dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === current);
      });
      counter.textContent = (current + 1) + ' / ' + slides.length;
    }

    function changeSlide(direction) {
      img.classList.add('fade-out');
      setTimeout(function () {
        current = (current + direction + slides.length) % slides.length;
        updateUI();
        img.classList.remove('fade-out');
      }, 200);
    }

    function goToSlide(index) {
      if (index === current) return;
      img.classList.add('fade-out');
      setTimeout(function () {
        current = index;
        updateUI();
        img.classList.remove('fade-out');
      }, 200);
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') changeSlide(-1);
      if (e.key === 'ArrowRight') changeSlide(1);
    });

    updateUI();
  </script>
</body>
</html>
