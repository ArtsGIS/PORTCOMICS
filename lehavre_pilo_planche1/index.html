<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Carrousel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      background: #0f0f0f;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    #container {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      height: var(--app-h, 100dvh);
      display: flex;
      flex-direction: column;
      background: #0f0f0f;
    }

    #image-wrapper {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      min-height: 0;
      min-width: 0;
    }

    #carousel {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    #carousel.fade-out {
      opacity: 0;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      border: 2px solid rgba(255, 255, 255, 0.7);
      color: white;
      font-size: 26px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: all 0.25s ease;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.95);
      color: #111;
      border-color: white;
      transform: translateY(-50%) scale(1.08);
    }

    #prev { left: 18px; }
    #next { right: 18px; }

    #bottom-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 15;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.92) 0%, rgba(0, 0, 0, 0.78) 55%, rgba(0, 0, 0, 0) 100%);
      padding: 36px 24px calc(14px + env(safe-area-inset-bottom, 0px));
      text-align: center;
    }

    #caption {
      color: white;
      font-size: clamp(22px, 1.6vw + 1.1vh, 32px);
      line-height: 1.35;
      margin: 0 auto 12px;
      font-weight: 500;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      max-width: 62ch;
      overflow-wrap: anywhere;
    }

    #dots {
      display: flex;
      justify-content: center;
      gap: 9px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      border: 1.5px solid rgba(255, 255, 255, 0.5);
      cursor: pointer;
      transition: all 0.25s ease;
      flex-shrink: 0;
    }

    .dot.active {
      background: white;
      transform: scale(1.25);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
    }

    #counter {
      position: absolute;
      top: 16px;
      right: 18px;
      background: rgba(0, 0, 0, 0.55);
      color: white;
      font-size: 13px;
      font-weight: 500;
      padding: 5px 11px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 20;
    }

    @media (max-width: 720px), (max-height: 640px) {
      #bottom-bar {
        position: static;
        flex: 0 0 auto;
        background: rgba(0, 0, 0, 0.92);
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
      }

      #caption {
        font-size: clamp(14px, 3.4vw, 17px);
        line-height: 1.35;
        margin: 0 auto 8px;
        text-shadow: none;
      }

      #dots {
        position: static;
        transform: none;
        top: auto;
        left: auto;
        gap: 11px;
        padding: 0;
        background: none;
        border: none;
      }

      .dot {
        width: 12px;
        height: 12px;
      }

      .nav-btn {
        width: 40px;
        height: 40px;
        font-size: 22px;
      }

      #prev { left: 8px; }
      #next { right: 8px; }

      #counter {
        top: 8px;
        right: 8px;
        font-size: 12px;
      }
    }

    @media (orientation: landscape) and (max-height: 640px) {
      #container {
        flex-direction: row;
      }

      #image-wrapper {
        flex: 1 1 62%;
      }

      #bottom-bar {
        position: static;
        flex: 0 0 38%;
        max-width: 320px;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: stretch;
        gap: 12px;
        background: rgba(0, 0, 0, 0.92);
        padding: 12px 14px;
        text-align: left;
      }

      #caption {
        font-size: clamp(13px, 2.4vh, 16px);
        margin: 0;
        max-height: calc(100% - 36px);
        overflow-y: auto;
        text-align: left;
      }

      #dots {
        position: static;
        transform: none;
        justify-content: flex-start;
      }

      .nav-btn {
        width: 36px;
        height: 36px;
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="image-wrapper">
      <img id="carousel" src="" alt="Image du carrousel">
      <button class="nav-btn" id="prev" onclick="changeSlide(-1)">‹</button>
      <button class="nav-btn" id="next" onclick="changeSlide(1)">›</button>
      <div id="counter"></div>
    </div>

    <div id="bottom-bar">
      <div id="caption"></div>
      <div id="dots"></div>
    </div>
  </div>

  <script>
    // ========== MODIFIE ICI TES IMAGES + LÉGENDES ==========
    const slides = [
      {
        image: "https://artsgis.maps.arcgis.com/sharing/rest/content/items/796f1a5c0e484937b5cad902e3726f5c/data",
        caption: "Adèle. Pas une poignée. Un vecteur. Les coupes sont déjà dans la paume."
      },
       {
        image: "https://artsgis.maps.arcgis.com/sharing/rest/content/items/928166c0499b47ffaeb7b9c80b454e6b/data",
        caption: "Gilles parle humains. Il parle de lui. Elle regarde le score du Port."
      },
       {
        image: "https://artsgis.maps.arcgis.com/sharing/rest/content/items/83b97d6ebfac4aefa4ebc19062e2572e/data",
        caption: "Elle encaisse le mentor pour ne pas encaisser le tableau."
      },
      {
        image: "https://artsgis.maps.arcgis.com/sharing/rest/content/items/af27ee56bfff4f3d8bc7cbd9798b474a/data",
        caption: "Pas un argument. Le programme. Elle exécute la reco. Jumeau a fini avant eux."
      },
      {
        image: "https://artsgis.maps.arcgis.com/sharing/rest/content/items/d86095586def46adb96f4335602fe766/data",
        caption: "Elle n’a plus à le convaincre. Elle a besoin qu’il voie que c’est fait. Le Consortium non plus n’a plus besoin du père."
      }
    ];
    // =======================================================

    let current = 0;
    const img = document.getElementById('carousel');
    const caption = document.getElementById('caption');
    const dotsContainer = document.getElementById('dots');
    const counter = document.getElementById('counter');

    function fitViewport() {
      const h = (window.visualViewport && window.visualViewport.height)
        ? window.visualViewport.height
        : window.innerHeight;
      document.documentElement.style.setProperty('--app-h', h + 'px');
    }
    fitViewport();
    window.addEventListener('resize', fitViewport);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', fitViewport);
    }

    slides.forEach(function (_, index) {
      const dot = document.createElement('div');
      dot.classList.add('dot');
      if (index === 0) dot.classList.add('active');
      dot.addEventListener('click', function () { goToSlide(index); });
      dotsContainer.appendChild(dot);
    });

    function updateUI() {
      img.src = slides[current].image;
      caption.textContent = slides[current].caption;
      document.querySelectorAll('.dot').forEach(function (dot, i) {
        dot.classList.toggle('active', i === current);
      });
      counter.textContent = (current + 1) + ' / ' + slides.length;
    }

    function changeSlide(direction) {
      img.classList.add('fade-out');
      setTimeout(function () {
        current = (current + direction + slides.length) % slides.length;
        updateUI();
        img.classList.remove('fade-out');
      }, 200);
    }

    function goToSlide(index) {
      if (index === current) return;
      img.classList.add('fade-out');
      setTimeout(function () {
        current = index;
        updateUI();
        img.classList.remove('fade-out');
      }, 200);
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') changeSlide(-1);
      if (e.key === 'ArrowRight') changeSlide(1);
    });

    let touchStartX = 0;
    document.addEventListener('touchstart', function (e) {
      touchStartX = e.changedTouches[0].clientX;
    }, { passive: true });
    document.addEventListener('touchend', function (e) {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 40) changeSlide(dx < 0 ? 1 : -1);
    }, { passive: true });

    updateUI();
  </script>
</body>
</html>
